# 站点线上地址（GitHub Pages 项目页）
baseURL = 'https://yongwang12138.github.io/blog/'

# 博客标题（显示在浏览器标题与导航左上角）
title = 'Mars星球'

# 站点语言（影响 html lang）
languageCode = 'zh-cn'

# 默认内容语言
defaultContentLanguage = 'zh-cn'

# 中文内容优化（摘要/字数统计）
hasCJKLanguage = true

# 时区（影响日期显示）
timeZone = 'Asia/Shanghai'

# 生成 robots.txt
enableRobotsTXT = true

# 自动摘要长度
summaryLength = 120

# 文章永久链接格式
[permalinks]
  # 按分类组织：/分类名/文章slug.html
  cpp = '/:section/:slug.html'
  git = '/:section/:slug.html'
  other = '/:section/:slug.html'
  qt = '/:section/:slug.html'

# Markdown 渲染配置
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 允许在 Markdown 中使用原生 HTML
      unsafe = true

[menu]
  # 顶部导航：主页
  [[menu.home]]
    name = '主页'
    pageRef = '/'
    weight = 10

  # 顶部导航：C++（直接链接到第一篇文章）
  [[menu.home]]
    name = 'C++'
    pageRef = '/cpp/cpp-header-only-libs.html'
    weight = 20

  # 顶部导航：Git（直接链接到第一篇文章）
  [[menu.home]]
    name = 'Git'
    pageRef = '/git/git-tutorial.html'
    weight = 30

  # 顶部导航：Qt（直接链接到第一篇文章）
  [[menu.home]]
    name = 'Qt'
    pageRef = '/qt/index.html'
    weight = 30

  # 顶部导航：其他（直接链接到第一篇文章）
  [[menu.home]]
    name = '其他'
    pageRef = '/other/compare.html'
    weight = 40

  

[params]
  # 站点描述（meta description）
  description = 'Tech notes, reading, and life logs.'

  [params.docLayout]
    # 文档页最外层左右布局比例
    leftColumn = '20%'
    rightColumn = '1fr'

    # 左侧栏内容横向内边距
    leftContentInset = '20%'

    # 文档正文区（中间列）宽度
    # 示例：'1fr'、'2fr'、'70%'、'minmax(0, 1fr)'
    mainColumn = '1fr'

    # 右侧目录列宽度
    # 示例：'268px'、'22%'、'minmax(220px, 26%)'
    tocColumn = '25%'

  [params.home]
    # 品牌区：logo、GitHub 链接
    logo = 'brand.svg'
    socialGithub = 'https://github.com/yongwang12138'
    githubButtonText = 'View on GitHub'

    # 教程菜单标题与教程分类名（用于下拉与左侧列表筛选）
    tutorialMenuTitle = '教程'
    tutorialCategory = '教程'

    # 首页 Hero 区文案与图片
    heroText = '一个 VitePress 博客'
    heroTagline = '将有一天你会拥有美好的一切'
    heroImage = 'background.svg'

    # 搜索框文案
    searchButtonText = '搜索文档'
    searchPlaceholder = '输入关键词'
    searchNoResults = '无法找到相关结果'

    # 首页按钮组
    [[params.home.actions]]
      text = 'C++ 文章'
      link = '/cpp/cpp-header-only-libs.html'
      theme = 'brand'
      external = false

    [[params.home.actions]]
      text = 'Git 教程'
      link = '/git/git-tutorial.html'
      theme = 'alt'
      external = false

    # 首页特性卡片
    [[params.home.features]]
      icon = '📝'
      title = '专注内容'
      details = '只需 Markdown 即可轻松创建美观文档站点。'

    [[params.home.features]]
      icon = '🛠️'
      title = '特性 B'
      details = '特性 B 的详细描述'

    [[params.home.features]]
      icon = '🚀'
      title = '特性 C'
      details = '特性 C 的详细描述'
