# 站点线上地址（你的仓库是 yongwang12138/blog）
baseURL = 'https://yongwang12138.github.io/blog/'

# 博客标题（显示在浏览器标题和导航左上角）
title = 'Mars星球'

# 站点语言（影响 html lang）
languageCode = 'zh-cn'

# 默认内容语言
defaultContentLanguage = 'zh-cn'

# 中文内容优化（摘要/分词）
hasCJKLanguage = true

# 时区（影响日期显示）
timeZone = 'Asia/Shanghai'

# 生成 robots.txt
enableRobotsTXT = true

# 自动摘要长度
summaryLength = 120

# 文章永久链接：/tutorial/xxx.html
[permalinks]
  posts = '/tutorial/:slug.html'

# Markdown 渲染配置
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 允许 Markdown 中使用原生 HTML
      unsafe = true

[menu]
  # 顶部主导航
  [[menu.home]]
    name = '主页'
    pageRef = '/'
    weight = 10

  [[menu.home]]
    name = '示例'
    pageRef = '/posts/'
    weight = 20

  [[menu.home]]
    name = 'Linux'
    pageRef = '/docs/'
    weight = 30

  [[menu.home]]
    name = '教程'
    pageRef = '/docs/'
    weight = 40

[params]
  # 站点描述（meta description）
  description = 'Tech notes, reading, and life logs.'

  [params.docLayout]
    # 文档页最外层左右布局比例
    leftColumn = '20%'
    rightColumn = '1fr'

    # 左侧栏内部横向边距（可写 px/%/rem）
    leftContentInset = '30%'

  [params.home]
    # 品牌区配置
    logo = '/brand.svg?v=4'
    socialGithub = 'https://github.com/yongwang12138'
    githubButtonText = 'View on GitHub'

    # 教程菜单分组名称（用于下拉和左侧列表筛选）
    tutorialMenuTitle = '教程'
    tutorialCategory = '教程'

    # 首页 Hero 文案
    heroText = '一个 VitePress 博客'
    heroTagline = '将有一天你会拥有美好的一切'
    heroImage = '/background.svg'

    # 搜索文案
    searchButtonText = '搜索文档'
    searchPlaceholder = '输入关键词'
    searchNoResults = '无法找到相关结果'

    # 首页按钮组
    [[params.home.actions]]
      text = 'Markdown 示例'
      link = '/posts/'
      theme = 'brand'
      external = false

    [[params.home.actions]]
      text = 'API 示例'
      link = '/docs/'
      theme = 'alt'
      external = false

    # 首页特性卡片
    [[params.home.features]]
      icon = '📝'
      title = '专注内容'
      details = '只需 Markdown 即可轻松创建美观文档站点。'

    [[params.home.features]]
      icon = '🛠️'
      title = '特性 B'
      details = '特性 B 的详细描述'

    [[params.home.features]]
      icon = '🚀'
      title = '特性 C'
      details = '特性 C 的详细描述'
