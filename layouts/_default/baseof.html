<!doctype html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="icon" href="/brand.svg">
  <link rel="stylesheet" href="/site.css">
</head>
<body class="{{ if .IsHome }}is-home{{ else }}is-page{{ end }}">
  {{ if not .IsHome }}
  <header class="site-nav">
    <div class="nav-inner">
      <a class="brand" href="/">
        <img src="/brand.svg" alt="logo">
        <span>{{ .Site.Title }}</span>
      </a>
      <nav>
        {{ range .Site.Menus.home }}
          <a href="{{ .URL | default .PageRef }}">{{ .Name }}</a>
        {{ end }}
      </nav>
      <button class="theme-toggle" type="button" aria-label="Theme" role="switch" aria-checked="false" data-theme-toggle>
        <span class="toggle-thumb"></span>
      </button>
    </div>
  </header>
  {{ end }}

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <small>{{ .Site.Title }} - {{ .Site.Copyright }}</small>
  </footer>

  <script>
  (() => {
    const applyTheme = (theme) => {
      const dark = theme === 'dark';
      document.documentElement.classList.toggle('dark-mode', dark);
      document.querySelectorAll('[data-theme-toggle]').forEach((btn) => {
        btn.setAttribute('aria-checked', dark ? 'true' : 'false');
      });
    };

    const stored = localStorage.getItem('theme-preference');
    if (stored === 'light' || stored === 'dark') {
      applyTheme(stored);
    } else {
      applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }

    document.querySelectorAll('[data-theme-toggle]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const next = document.documentElement.classList.contains('dark-mode') ? 'light' : 'dark';
        localStorage.setItem('theme-preference', next);
        applyTheme(next);
      });
    });
  })();
  </script>
</body>
</html>
